name: Build and deploy preview to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Deliberately WITHOUT lfs: true. The press masters in public/images are
      # LFS objects running to hundreds of megabytes; fetching them here would
      # spend the account's monthly LFS bandwidth on every push and push the
      # published site towards the 1 GB Pages cap. `npm run build:web` reads
      # the committed screen-resolution derivatives in public/images-web
      # instead, so this job needs no LFS at all. Refresh them with
      # `npm run derive` after placing images.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web

      # The pre-press checks, on every push. Each one is here because that
      # exact fault reached a proof in this project and was found by hand
      # weeks later — a placeholder printed on the back cover, two credits for
      # images that had been cut, British spellings arriving with the imprint.
      # Failing the deploy is the point: a preview that looks right while the
      # manifest quietly disagrees with it is the thing this catches.
      #
      # It runs against the web build, whose masters are LFS pointers here
      # rather than pixels, which is why verify.mjs treats a derivative as
      # proof the project holds an image.
      #
      # Copy overflow is checked here too. verify shells out to
      # scripts/overflow.mjs, which finds the Chrome this runner already has
      # and drives the preview's own overflow rule in it. If a runner ever
      # ships without one the check reports itself as not run rather than
      # passing — which is the state this repository insists on, because a
      # green tick beside an unrun check is worse than no check.
      - run: npm run verify -- --strict

      # THE CONDENSED EDITION, PUBLISHED ALONGSIDE RATHER THAN INSTEAD.
      #
      # `condensed` holds the four-essay, 94-page cut of the same book. Both are
      # real deliverables and neither supersedes the other yet — the choice waits
      # on printer quotes — so the site carries both: this book at /, that one at
      # /condensed/.
      #
      # It is safe to nest because every link the build emits is RELATIVE
      # (`href="book.html"`, `href="download/..."`), checked before this step was
      # written. An absolute path anywhere would break under a subdirectory and
      # would need fixing at the source rather than papering over here.
      #
      # The second build runs the SAME `verify -- --strict`. A preview that looks
      # right while its manifest disagrees with it is exactly what this workflow
      # exists to stop, and that applies to both editions or it is not a rule.
      #
      # main's site is untouched by all of this: it is moved aside, the second
      # build is dropped into a subdirectory of it, and it is moved back.
      - run: mv build /tmp/site
      - run: git fetch --depth=1 origin condensed && git checkout condensed
      - run: npm ci
      - run: npm run build:web
      - run: npm run verify -- --strict
      - run: mkdir -p /tmp/site/condensed && cp -R build/. /tmp/site/condensed/
      - run: rm -rf build && mv /tmp/site build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
